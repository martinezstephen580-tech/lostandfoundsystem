{% extends "base.html" %}
{% block title %}Log in · Campus Lost &amp; Found{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="font-display text-3xl font-bold tracking-tight mt-4">Lost something? Found something?</h1>
  <p class="mt-2 text-ink/70">Log in with your student account to see what's been turned in around campus.</p>

  <form method="post" class="mt-6 bg-white rounded-2xl p-5 space-y-4 shadow-sm">
    <div>
      <label for="email" class="block text-sm font-semibold mb-1">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" inputmode="email"
             class="w-full rounded-xl border border-ink/15 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-ink">
    </div>
    <div>
      <label for="password" class="block text-sm font-semibold mb-1">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full rounded-xl border border-ink/15 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-ink">
    </div>
    <button type="submit" class="w-full rounded-xl bg-ink text-white font-semibold py-3.5 hover:bg-[#1d2f55] focus:outline-none focus-visible:ring-4 focus-visible:ring-ink/30">
      Log in
    </button>
  </form>

  <p class="mt-5 text-center text-sm text-ink/70">
    New here? <a href="{{ url_for('signup') }}" class="font-semibold text-ink underline underline-offset-2">Create an account</a>
  </p>
</div>
{% endblock %}
